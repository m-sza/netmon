  <div id="toolbar">
    <button id="btn-record" class="icon-btn" title="Pause recording">
      <svg class="i-pause" viewBox="0 0 16 16" width="16" height="16"><rect x="4" y="3" width="3" height="10" rx="0.5"/><rect x="9" y="3" width="3" height="10" rx="0.5"/></svg>
      <svg class="i-play" viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="5"/></svg>
    </button>
    <button id="btn-clear" class="icon-btn" title="Clear all requests">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 2h4l.5 1H13v1.5H3V3h2.5zM4 6h8l-.6 7.2a1 1 0 0 1-1 .8H5.6a1 1 0 0 1-1-.8z"/></svg>
    </button>
    <span class="sep"></span>
    <button id="btn-rules" class="text-btn" aria-haspopup="dialog">Rules</button>
    <span class="sep"></span>
    <div id="view-mode" class="seg" title="List: requests in order. Tree: each request under the one that caused it.">
      <button data-mode="list" class="active">List</button>
      <button data-mode="tree">Tree</button>
    </div>
    <button id="btn-overview" class="icon-btn" aria-pressed="false" title="Show the overview: every request on one timeline. Drag across it to show only that time range.">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h5M5 7h6M9 10h5M3 13h4" fill="none" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <span class="sep"></span>
    <div id="type-filters" class="seg">
      <button data-type="all" class="active">All</button>
      <button data-type="html">HTML</button>
      <button data-type="css">CSS</button>
      <button data-type="js">JS</button>
      <button data-type="xhr">XHR</button>
      <button data-type="font">Fonts</button>
      <button data-type="img">Images</button>
      <button data-type="media">Media</button>
      <button data-type="ws">WS</button>
      <button data-type="other">Other</button>
    </div>
    <span class="spacer"></span>
    <button id="tab-filter" class="select-btn" aria-haspopup="listbox" aria-expanded="false" title="Show requests from one tab"><span class="select-label">Current tab</span></button>
    <label class="check" title="Capture response bodies for new requests">
      <input type="checkbox" id="opt-bodies"> Capture bodies
    </label>
    <button id="btn-har" class="icon-btn" title="Save the requests shown as a HAR file" aria-label="Save as HAR">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="tab-pop" hidden>
    <input id="tab-search" type="search" spellcheck="false" placeholder="Find a tab" aria-label="Find a tab" aria-controls="tab-options">
    <ul id="tab-options" role="listbox" aria-label="Tabs"></ul>
  </div>

  <div id="rules-pop" role="dialog" aria-label="Filter rules" hidden>
    <div class="rules-head">
      <strong>Filter rules</strong>
      <span class="note">Every enabled rule must match. Same syntax as Firefox DevTools.</span>
    </div>
    <ul id="rules-list"></ul>
    <input id="rule-add" type="text" spellcheck="false" placeholder="Filter, e.g. -mime-type:text/css · Enter saves it as a rule"
           title="Filters as you type; Enter saves it as rules (one per word). Same syntax as Firefox DevTools: text, status-code:, method:, domain:, mime-type:, larger-than: / size-larger-than:, transferred-larger-than:, is:running/cached/blocked/error, regexp:, … Prefix with - to exclude.">
    <div class="rules-foot">
      <button id="rules-all-on" class="text-btn">All on</button>
      <button id="rules-all-off" class="text-btn">All off</button>
      <button id="rules-copy" class="text-btn" title="Copy the enabled rules as one DevTools filter">Copy</button>
      <span class="spacer"></span>
      <button id="rules-clear" class="text-btn">Remove all</button>
    </div>
  </div>

  <div id="overview" hidden>
    <canvas id="overview-canvas" aria-label="Overview of requests over time"></canvas>
    <div id="overview-range" hidden>
      <span id="overview-range-text"></span>
      <button id="overview-clear" class="text-btn" title="Show every time again (or double-click the overview)">Clear</button>
    </div>
  </div>

  <div id="main">
    <div id="list-pane">
      <table id="requests">
        <thead>
          <tr>
            <th class="c-status" data-sort="status">Status</th>
            <th class="c-method" data-sort="method">Method</th>
            <th class="c-domain" data-sort="domain">Domain</th>
            <th class="c-file" data-sort="file">File</th>
            <th class="c-initiator" data-sort="initiator">Initiator</th>
            <th class="c-type" data-sort="type">Type</th>
            <th class="c-transferred" data-sort="transferred">Transferred</th>
            <th class="c-size" data-sort="size">Size</th>
            <th class="c-time" data-sort="time">Time</th>
            <th class="c-waterfall" data-sort="waterfall">Waterfall</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty"></div>
    </div>
    <div id="splitter" hidden></div>
    <div id="details-pane" hidden>
      <div id="details-tabs">
        <button data-tab="headers" class="active">Headers</button>
        <button data-tab="cookies">Cookies</button>
        <button data-tab="request">Request</button>
        <button data-tab="response">Response</button>
        <button data-tab="messages" hidden>Messages</button>
        <button data-tab="timings">Timings</button>
        <button data-tab="security">Security</button>
        <span class="spacer"></span>
        <button id="btn-close-details" class="icon-btn" title="Close (Esc)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="details-body"></div>
    </div>
  </div>

  <div id="statusbar">
